; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) defense-in-depth.
; session.upload_progress.enabled=0 blocks the confirmed attack path for
; CVE-2026-109619 where the multipart parser drives session handling before
; the application script runs. This is NOT a complete fix — only updating
; PHP to >=8.2.35 fully patches the vulnerability — but it closes the known
; surface.  These settings are PHP_INI_PERDIR so .user.ini in the document
; root (public/) is the correct place for HostGator PHP-FPM.
session.upload_progress.enabled=0
session.upload_progress.cleanup=1

; Keep post_max_size bounded so a malicious multipart upload cannot exhaust
; memory_limit inside the upload-progress handler (CVE-2026-109618 surface).
; The LimitRequestBody middleware enforces this at the application layer too,
; but defense-in-depth at the PHP INI level stops the request before Laravel
; boots.  16 MB covers the largest legitimate upload (12 MB image + overhead).
post_max_size=16M
upload_max_filesize=12M
