name: Cloudflare Pages Design Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: gisley-nunes-design-preview
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static design preview
        run: pnpm build:preview

      - name: Ensure preview project exists
        shell: bash
        run: |
          PROJECTS="$(pnpm dlx wrangler@latest pages project list --json)"
          if ! printf '%s' "$PROJECTS" | node -e '
            let data="";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(data);
              const projects = Array.isArray(parsed) ? parsed : parsed.result || [];
              process.exit(projects.some(p => p.name === process.env.PROJECT_NAME) ? 0 : 1);
            });
          '; then
            pnpm dlx wrangler@latest pages project create "$PROJECT_NAME" --production-branch "$GITHUB_REF_NAME"
          fi

      - name: Deploy design preview
        run: |
          pnpm dlx wrangler@latest pages deploy dist-preview             --project-name "$PROJECT_NAME"             --branch "$GITHUB_REF_NAME"             --commit-hash "$GITHUB_SHA"             --commit-message "Design preview $GITHUB_SHA"
