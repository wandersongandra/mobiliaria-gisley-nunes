name: Laravel production package

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_NAME: Gisley Nunes Imóveis
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://example.test
      ADMIN_ORIGIN: https://painel.example.test
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: gisley_production_package
      DB_USERNAME: package_user
      DB_PASSWORD: package-only
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'true'
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      TRUSTED_PROXIES: 203.0.113.0/24
      R2_ACCOUNT_ID: package-account
      R2_BUCKET: package-bucket
      R2_ACCESS_KEY_ID: package-key
      R2_SECRET_ACCESS_KEY: package-secret
      GOOGLE_CLIENT_ID: package-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: package-client-secret
      GISELY_ADMIN_BOOTSTRAP_EMAILS: bootstrap@example.test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install production dependencies only
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Boot the production package
        run: |
          php artisan about
          php artisan route:list
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan app:production-check
