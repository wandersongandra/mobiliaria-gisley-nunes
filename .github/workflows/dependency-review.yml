name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve actual repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          [[ "$is_private" == 'true' || "$is_private" == 'false' ]]
          echo "private=$is_private" >> "$GITHUB_OUTPUT"

      - name: GitHub Dependency Review (public repositories)
        if: steps.visibility.outputs.private == 'false'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Checkout for private dependency audit
        if: steps.visibility.outputs.private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP for private audit
        if: steps.visibility.outputs.private == 'true'
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # v2.40.0
        with:
          php-version: '8.3.36'
          coverage: none

      - name: Install Composer dependencies
        if: steps.visibility.outputs.private == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        if: steps.visibility.outputs.private == 'true'
        run: composer audit --no-interaction

      - name: Setup pnpm for private audit
        if: steps.visibility.outputs.private == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.1

      - name: Setup Node for private audit
        if: steps.visibility.outputs.private == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        if: steps.visibility.outputs.private == 'true'
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        if: steps.visibility.outputs.private == 'true'
        run: pnpm audit --prod --audit-level=moderate
