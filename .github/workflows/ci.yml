name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  auth-mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gisley_phase2_test
          MYSQL_USER: gisley_ci
          MYSQL_PASSWORD: integration-only
          MYSQL_ROOT_PASSWORD: root-integration-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: MySQL authentication integration
        run: pnpm test:mysql
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://gisley_ci:integration-only@127.0.0.1:3306/gisley_phase2_test
          DATABASE_SSL_MODE: disable
          GISELY_MAX_ADMIN_SESSIONS: 3
          SEED_DEMO_DATA: 'false'

  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: pnpm security:secrets
      - name: Syntax check
        run: node --check server/config.js && node --check server/authorization.js && node --check server/security.js && node --check server/storage.js && node --check server/auth.js && node --check server/db.js && node --check server/routes.js && node --check admin/main.js && node --check src/main.js
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build Cloudflare Pages preview
        run: pnpm build:preview
      - name: Upload design preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-preview
          path: dist-preview
          if-no-files-found: error
          retention-days: 3
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate
      - name: Build production container
        run: docker build --pull --tag gisley-nunes-imoveis:ci .
