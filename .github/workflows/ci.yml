name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Syntax check
        run: node --check server/config.js && node --check server/security.js && node --check server/storage.js && node --check server/auth.js && node --check server/db.js && node --check server/routes.js && node --check admin/main.js && node --check src/main.js
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build Cloudflare Pages preview
        run: pnpm build:preview
      - name: Upload design preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-preview
          path: dist-preview
          if-no-files-found: error
          retention-days: 3
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Build production container
        run: docker build --pull --tag gisley-nunes-imoveis:ci .
