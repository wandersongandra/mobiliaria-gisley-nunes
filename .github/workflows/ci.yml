name: Laravel quality gates

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_NAME: Gisley Nunes Imóveis
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8080
      ADMIN_ORIGIN: http://127.0.0.1:8080
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      GISELY_ADMIN_OPEN_IDS: test-bootstrap-open-id
      R2_ACCOUNT_ID: test-account
      R2_BUCKET: test-bucket
      R2_ACCESS_KEY_ID: test-key
      R2_SECRET_ACCESS_KEY: test-secret
      MANUS_OAUTH_PORTAL_URL: https://oauth.example.test
      MANUS_OAUTH_API_URL: https://oauth-api.example.test
      MANUS_PROJECT_ID: test-project

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: PHP runtime
        run: |
          php -v
          composer --version
          php -m | grep -qi pdo_sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer manifest and lockfile
        run: composer validate --strict --no-interaction

      - name: PHP syntax
        run: |
          find app bootstrap config database/migrations routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Format check
        run: composer run format:check

      - name: Static analysis
        run: composer run analyse

      - name: Application boot and routes
        run: |
          php artisan about
          php artisan route:list

      - name: Database migrations
        run: php artisan migrate --force

      - name: Feature tests
        run: composer run test

      - name: Configuration and route caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: HTTP runtime health route
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 >/tmp/laravel-health.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if health_body="$(curl --silent --show-error --fail http://127.0.0.1:8080/_app/health 2>/dev/null)" \
              && [ "$health_body" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laravel-health.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: >-
          node --check server/config.js && node --check server/authorization.js
          && node --check server/security.js && node --check server/storage.js
          && node --check server/auth.js && node --check server/db.js
          && node --check server/routes.js && node --check admin/main.js
          && node --check src/main.js && node --check public/admin/main.js

      - name: Build frontend assets
        run: pnpm build

      - name: Verify Laravel public artifacts
        run: pnpm test:source

      - name: Build Cloudflare design preview
        run: pnpm build:preview

      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Frontend browser smoke
        run: pnpm test:browser

      - name: Frontend tests
        run: pnpm test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-preview
          path: dist-preview
          if-no-files-found: error
          retention-days: 3

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer security audit
        run: composer audit --no-interaction

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm security:secrets
