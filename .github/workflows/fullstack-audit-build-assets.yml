name: Rebuild Gisley PR assets (temporary)
on:
  push:
    branches:
      - audit/fullstack-quality-mobile-2026-10-13
    paths:
      - .github/workflows/fullstack-audit-build-assets.yml
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Generate Laravel public bundles from sources
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:source
      - name: Commit only generated, versioned assets
        run: |
          git add public/assets/main.js public/assets/main.css public/admin/index.html public/admin/main.js public/admin/styles.css public/admin/refinements.css
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(frontend): sync audited Laravel and CRM production assets"
          git push origin HEAD:audit/fullstack-quality-mobile-2026-10-13
